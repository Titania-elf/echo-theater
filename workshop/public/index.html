<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 刻意不被搜索引擎收录：只在插件和 Discord 里流通 -->
<meta name="robots" content="noindex, nofollow, noarchive">
<title>回声工坊</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="topbar" hidden>
  <a class="brand" href="#/">回声工坊</a>
  <nav>
    <a href="#/" data-nav="list">浏览</a>
    <a href="#/mine" data-nav="mine">我的投稿</a>
    <a href="#/import" data-nav="import" id="navImport" hidden>批量导入</a>
  </nav>
  <div id="authSlot" class="auth-slot"></div>
</header>

<main id="view" class="view access-view" aria-live="polite">
  <section class="access-page">
    <div class="access-panel access-checking">
      <div class="echo-mark" aria-hidden="true"></div>
      <p class="access-kicker">ECHO WORKSHOP</p>
      <h1>回声工坊</h1>
      <p class="access-status">正在确认登录状态…</p>
    </div>
  </section>
</main>

<footer class="footer" hidden>
  <span>回声剧场 · 工坊</span>
  <span id="ratingToggle" class="rating-toggle"></span>
</footer>

<div id="toast" class="toast" hidden></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
